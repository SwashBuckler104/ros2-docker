name: Reusable image CI

# Called by .github/workflows/ci.yml with this branch's image tag, build
# args and smoke-test commands.

on:
  workflow_call:
    inputs:
      image-tag:
        description: Tag to build and smoke-test
        required: true
        type: string
      smoke-test-cmd:
        description: Command run inside the built image to smoke-test it
        required: true
        type: string
      interactive-shell-test-cmd:
        description: >-
          Optional command run in a fresh interactive bash with the image
          entrypoint bypassed, i.e. the environment `docker exec -it <c> bash`
          gets (image ENV + bashrc only). Skipped when empty.
        required: false
        type: string
        default: ""
      dockerfile:
        description: Path to the Dockerfile
        required: false
        type: string
        default: Dockerfile
      build-args:
        description: Newline-separated build args, e.g. "GPU=off\nUID=1000"
        required: false
        type: string
        default: "GPU=off"

jobs:
  hadolint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ inputs.dockerfile }}
          # DL3008/DL3013: unpinned apt/pip versions -- tracked as a known
          # gap on branches that install via rosdep-resolved package lists.
          ignore: DL3008,DL3013

  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # shellcheck is preinstalled on GitHub's Ubuntu runners; the repo's
      # .shellcheckrc applies.
      - name: Lint shell scripts
        run: |
          shellcheck --version
          git ls-files -z '*.sh' | xargs -0 --no-run-if-empty shellcheck

  build-and-smoke-test:
    needs: [hadolint, shellcheck]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: |
          BUILD_ARGS=()
          while IFS= read -r arg; do
            [ -z "$arg" ] && continue
            BUILD_ARGS+=(--build-arg "$arg")
          done <<< "${{ inputs.build-args }}"
          docker build -f "${{ inputs.dockerfile }}" "${BUILD_ARGS[@]}" -t "${{ inputs.image-tag }}" .

      - name: Smoke test
        run: docker run --rm "${{ inputs.image-tag }}" bash -lc "${{ inputs.smoke-test-cmd }}"

      # The smoke test above goes through the entrypoint, so it can't catch an
      # image whose ROS environment only exists in PID 1. Shells started with
      # `docker exec` (scripts/enter.sh, VS Code terminals) never run the
      # entrypoint; `--entrypoint bash ... -ic` reproduces exactly that, and
      # `-t` gives it a pty like `docker exec -it`.
      - name: Interactive shell test (entrypoint bypassed)
        if: inputs.interactive-shell-test-cmd != ''
        run: docker run --rm -t --entrypoint bash "${{ inputs.image-tag }}" -ic "${{ inputs.interactive-shell-test-cmd }}"

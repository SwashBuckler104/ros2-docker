name: humble/drone CI

on:
  push:
    branches: [humble/drone]
  pull_request:
    branches: [humble/drone]

jobs:
  ci:
    uses: ./.github/workflows/_reusable-image-ci.yml
    with:
      image-tag: ros2-docker:humble-drone-ci
      build-args: |
        GPU=off
        ENABLE_PX4=off
      # Runs through the entrypoint. No manual `source` on purpose: this must
      # fail if the entrypoint stops providing the ROS environment. `ros2 pkg
      # prefix`, not `ros2 pkg list | grep -q`, which closes the pipe early
      # and makes ros2 log a BrokenPipeError.
      #
      # The workspace build covers both minimal_pkg (ament_cmake) and
      # minimal_py_pkg (ament_python, which a pip-installed setuptools >= 80
      # breaks). `pip check` catches resolver conflicts in the RL stack, and
      # scipy must import without NumPy-version warnings.
      smoke-test-cmd: >-
        ros2 --help > /dev/null &&
        ros2 pkg prefix vins > /dev/null &&
        ros2 pkg prefix mavros > /dev/null &&
        python3 -m pip check &&
        python3 -W error::UserWarning -c 'import scipy, torch, stable_baselines3, gymnasium' &&
        colcon build --symlink-install --base-paths /home/dev/ws
      # Regression test for GitHub issue #1: a fresh interactive shell that
      # bypasses the entrypoint (what `docker exec -it`, scripts/enter.sh and
      # VS Code terminals get) must have ROS with no manual sourcing, must
      # colcon-build the sample workspace, and a new shell opened after the
      # build must pick up the workspace overlay.
      interactive-shell-test-cmd: >-
        command -v ros2 &&
        ros2 pkg prefix vins > /dev/null &&
        ros2 pkg prefix mavros > /dev/null &&
        cd /home/dev/ws &&
        colcon build --symlink-install &&
        bash -ic 'ros2 pkg prefix minimal_pkg && ros2 run minimal_py_pkg minimal_py_node'

  # Every Compose combination the README and the dev containers use must
  # parse, with the .env scripts/setup-env.sh generates (docker-compose.yml
  # refuses to interpolate without it).
  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate .env
        run: ./scripts/setup-env.sh
      - name: Validate compose files
        run: |
          docker compose version
          docker compose config -q
          docker compose -f docker-compose.yml -f docker-compose.gpu.yml config -q
          docker compose -f docker-compose.yml -f .devcontainer/docker-compose.devcontainer.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.gpu.yml \
            -f .devcontainer/docker-compose.devcontainer.yml \
            -f .devcontainer/gpu/docker-compose.devcontainer-gpu.yml config -q

services:
  # Host ids (HOST_UID/HOST_GID and the dialout/video/render gids) come from
  # a gitignored ./.env that Compose reads automatically: run
  # ./scripts/setup-env.sh once per clone (scripts/build.sh and the VS Code
  # dev container do it for you). There are deliberately no defaults: bash
  # and zsh don't export $UID/$GID, so a `${UID:-1000}` fallback silently
  # built the image for UID 1000 and left ./workspace unwritable and X11
  # refused for every other user.
  #
  # This base file is deliberately hardware-agnostic -- it works unmodified
  # on any PC (CPU-only, integrated GPU, or a discrete GPU you're not using
  # through Docker yet). GPU render nodes (/dev/dri) come in through the /dev
  # bind-mount plus a device cgroup rule, which, unlike a `devices:` entry,
  # doesn't fail on a host that has none. It intentionally does NOT request
  # an NVIDIA GPU reservation: Compose has no way to make a `deploy:` entry
  # conditional, and it fails `docker compose up` outright on a host without
  # the NVIDIA Container Toolkit. To opt into CUDA passthrough (only once the
  # toolkit is installed -- see README), layer in docker-compose.gpu.yml:
  #   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
  # scripts/run.sh does the equivalent detection for you automatically, and
  # is the recommended path if you don't need Compose specifically.
  drone:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GPU: "${GPU:-off}"
        ENABLE_PX4: "${ENABLE_PX4:-off}"
        HOST_UID: "${HOST_UID:?run ./scripts/setup-env.sh first (writes .env)}"
        HOST_GID: "${HOST_GID:?run ./scripts/setup-env.sh first (writes .env)}"
        # Parallel compile jobs; each can take 1-2 GB of RAM. scripts/build.sh
        # sizes this from your RAM -- for Compose, set BUILD_JOBS in .env.
        BUILD_JOBS: "${BUILD_JOBS:-4}"
    image: ros2-docker:humble-drone
    container_name: ros2-docker-humble-drone
    stdin_open: true
    tty: true
    # tini as PID 1: reaps processes orphaned by `ros2 launch` and forwards
    # signals (the image's STOPSIGNAL SIGHUP is what makes the interactive
    # bash exit promptly on `docker compose down`/`stop`).
    init: true
    network_mode: host
    ipc: host
    privileged: false
    environment:
      - DISPLAY=${DISPLAY:-}
      - QT_X11_NO_MITSHM=1
      # Passed through from your shell (or .env) only when set; otherwise the
      # ROS defaults apply. With host networking every ROS 2 node on the LAN
      # in the same domain (default 0) can see and command yours -- pick a
      # domain per developer/vehicle (see README "ROS 2 networking").
      - ROS_DOMAIN_ID
      - ROS_LOCALHOST_ONLY
      - RMW_IMPLEMENTATION
    volumes:
      - ./workspace:/home/dev/ws:rw
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /dev:/dev
    # Lets the non-root `dev` user open devices that are group-owned on the
    # host, all gids from .env: serial ports (root:dialout, e.g. a
    # CubeOrangePlus on /dev/ttyACM0), cameras and GPU card nodes
    # (root:video, /dev/video*, /dev/dri/card*) and GPU render nodes
    # (root:render, /dev/dri/renderD*). Without video/render, Mesa can only
    # open the GPU through the logind ACL a local desktop login gets, and
    # rviz2/Gazebo silently fall back to software rendering everywhere else
    # (SSH, remote desktop).
    group_add:
      - "${DIALOUT_GID:?run ./scripts/setup-env.sh first (writes .env)}"
      - "${VIDEO_GID:?run ./scripts/setup-env.sh first (writes .env)}"
      - "${RENDER_GID:?run ./scripts/setup-env.sh first (writes .env)}"
    # The /dev bind-mount above only makes device nodes *visible*; the
    # container's device cgroup still refuses to open them (EPERM, even as
    # root) unless allowed here. 166 = USB CDC-ACM (/dev/ttyACM*, e.g. a
    # CubeOrangePlus over USB), 188 = USB-serial adapters (/dev/ttyUSB*,
    # telemetry radios), 81 = V4L2 cameras (/dev/video*, e.g. a VINS camera),
    # 226 = DRI GPU nodes (/dev/dri/*, hardware-accelerated rviz2/Gazebo).
    # Matches by major number, so hot-plugged devices work too, and a rule
    # for a device the host doesn't have is harmless.
    device_cgroup_rules:
      - "c 166:* rmw"
      - "c 188:* rmw"
      - "c 81:* rmw"
      - "c 226:* rmw"

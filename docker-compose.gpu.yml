# Optional overlay: NVIDIA CUDA passthrough for the `drone` service. Only
# apply this on a host with an NVIDIA GPU AND the NVIDIA Container Toolkit
# installed (see README) -- the reservation below makes `docker compose up`
# fail outright if either is missing, which is exactly why it lives here
# instead of in the base docker-compose.yml. (/dev/dri render nodes need no
# overlay: the base file allows them via a device cgroup rule.)
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
services:
  drone:
    # Builds and runs the GPU variant under its own tag, like
    # `scripts/build.sh --gpu on` does, so a Compose GPU build neither needs
    # GPU=on in the environment nor overwrites the CPU image's tag.
    build:
      args:
        GPU: "on"
    image: ros2-docker:humble-drone-gpu
    # Also mount the driver's OpenGL/EGL libraries (graphics,display), so
    # rviz2/Gazebo render on the GPU instead of Mesa's software fallback.
    environment:
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,graphics,display
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
